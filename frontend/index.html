<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinSafe Financial Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f7f6; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #2c3e50; }
        h2 { color: #34495e; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f4f7f6; text-align: left; padding: 10px; border-bottom: 2px solid #ddd; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.85em; font-weight: bold; }
        .deposit { background: #d4edda; color: #155724; }
        .withdrawal { background: #f8d7da; color: #721c24; }
        .transfer { background: #d1ecf1; color: #0c5460; }
        .summary-grid { display: flex; gap: 20px; margin-top: 10px; }
        .summary-item { flex: 1; background: #f4f7f6; padding: 15px; border-radius: 8px; text-align: center; }
        .summary-item .amount { font-size: 1.5em; font-weight: bold; color: #2c3e50; }
        .summary-item .label { font-size: 0.85em; color: #777; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div class="card">
        <h1>CoinSafe Dashboard</h1>
        <p>Welcome to the secure financial portal.</p>
    </div>

    <div class="card">
        <h2>Summary</h2>
        <div class="summary-grid" id="summary-container">
            <p><i>Loading...</i></p>
        </div>
    </div>

    <div class="card">
        <h2>Transactions</h2>
        <div id="data-container">
            <p><i>Loading...</i></p>
        </div>
    </div>

    <script>
        // Fetch transaction summary from API and render summary cards
        fetch('http://localhost:5000/api/summary')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('summary-container');
                container.innerHTML = data.map(item => `
                    <div class="summary-item">
                        <div class="amount">£${item.total.toFixed(2)}</div>
                        <div class="label">${item.type} (${item.count})</div>
                    </div>
                `).join('');
            })
            .catch(() => {
                document.getElementById('summary-container').innerHTML = '<p>Could not load summary.</p>';
            });

        // Fetch all transactions from API and render as table
        fetch('http://localhost:5000/api/transactions')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('data-container');
                container.innerHTML = `
                    <table>
                        <thead>
                            <tr><th>ID</th><th>User</th><th>Amount</th><th>Type</th><th>Timestamp</th></tr>
                        </thead>
                        <tbody>
                            ${data.map(t => `
                                <tr>
                                    <td>${t.id}</td>
                                    <td>${t.user_id}</td>
                                    <td>£${t.amount.toFixed(2)}</td>
                                    <td><span class="badge ${t.transaction_type}">${t.transaction_type}</span></td>
                                    <td>${new Date(t.timestamp).toLocaleString('en-GB', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            })
            .catch(() => {
                document.getElementById('data-container').innerHTML = '<p>Could not load transactions.</p>';
            });
    </script>
  </body>
</html>
